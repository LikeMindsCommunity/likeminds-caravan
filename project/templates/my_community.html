{% extends 'base.html' %}

{% block breadcrumb %}
    <li class="breadcrumb-item "><a href="../dashboard"> Home </a></li>
    <li class="breadcrumb-item active">Profile</li>
    
{% endblock %}

{% block content %}
<body>
        <div class="ui top attached tabular menu">
                <a class="fluid active item" style = "width:50%; text-align: center;" href="mycommunities">
                  As a Member
                </a>
                <a class="fluid item"  style = "width:50%; text-align: center;" href="communities_as_admin">
                  As Admin
                </a>
                </div>
                <div class="ui two cards" style="margin:10px 10px; ">
                    {% for i in my_communities %}
                    <div class="card" style=" margin-left: 0.5em; margin-right:0.5em; width: calc(50% - 1em) !important;" >
                      <div class="image">
                        <img src="http://beta.collabmates.com/media/{{i.image_url}}" onclick="open_comm('{{i.id}}');">
                      </div>
                      <div class="extra">
                      <a href="{% url 'community' i.id %}"> 
                        {{i.name}}</a>
                      </div>
                    </div>
                    {% endfor %}
                  </div>

</body>

<script>
  function open_comm(id) {
    window.location = '/community/'+id;
  };
</script>
{% endblock %}
