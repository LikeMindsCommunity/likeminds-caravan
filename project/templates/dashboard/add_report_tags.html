{% load static %}
<html>
<head>
    <!-- Latest compiled and minified CSS -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">

<!-- jQuery library -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

<!-- Latest compiled JavaScript -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <script>
           function clearcontent(question_no) {

            $('#div_'+question_no).remove();
            var question_no = parseInt(question_no);
            var i;
            for(i=question_no+1;i<=count;i++)
            {
                var label_id = 'label_'+i
                var text = 'Option:'+(i-1)

                document.getElementById(label_id).innerText = text;


            }
        }

    </script>

</head>

<body>
<div style="width:800px;  margin-left: 40px;">
<h1>Reporting Tags</h1>


<form id="my_form" onsubmit="return false" >

    {% for dropdown in report_tags %}


    <div class="form-group" id="div_{{forloop.counter}}">

        <label id="label_{{forloop.counter}}">Option:{{ forloop.counter }}</label>&nbsp;
<!--        <a href="{% url 'delete_report_tags'  dropdown.id %} " id="delete_dropdown" onclick="clearcontent('{{forloop.counter}}')" style="color:red;"><i class="fa fa-trash" aria-hidden="true"></i>-->
<!--        </a>-->

            <input type="hidden" id="id{{forloop.counter}}" value="{{dropdown.id}}"/>
            <input type="text" class="form-control" id="option{{forloop.counter}}" value="{{dropdown.tag_name}}"/>
    </div>
  {% endfor %}
  <div id="form_field"></div>
    <button type="button" class="btn btn-primary" id="add">Add</button>&nbsp;&nbsp;&nbsp;
<!--    <button type="button" class="btn btn-danger" id="delete">Delete</button><br>-->
<br><br>

  <button type="submit" class="btn btn-default">Submit</button>

</form>

</div>
</body>


<script>

    $(document).ready(function(){
    count={{length}}

    $('#add').click(function(){
    count=count+1
    var id='option'+count
     var new_field= " <div class='form-group'><label for='option'>Option\"" + count + "\"</label> <input type='text' class='form-control' id=\"" + id + "\"></div>"
      $('#form_field').append(new_field);
    })

   $('#delete').click(function(){

   var id='option'+count
    id=$('#id'+count).val();
    console.log('hello')
    console.log(id)
   $('#'+id).parent('div').remove();
   count=count-1;

    $.ajax({

            url:'/admin_dashboard/delete_report_tags/'+id,
            success:function(data){
                 location.reload(true)

            }

         })

   })


    $('#my_form').submit(function(){

    var data=[]
    update_count={{length}};

    for(var i=1;i<=update_count;i++)
    {
        tag_name=$('#option'+i).val()
        if(typeof tag_name === 'undefined')
            continue;
        console.log(tag_name)
        id=$('#id'+i).val()
        console.log(id)

        var update_object={
        'type':{{type}},
        'tag_name':tag_name,
        'update':true,
        'id':id
        }

        data.push(update_object)
    }


    for(var i=update_count+1;i<=count;i++)
    {

        tag_name=$('#option'+i).val()
        console.log(tag_name)
        var create_object={
        'type':{{type}},
        'tag_name':tag_name,
        'update':false
        }

        data.push(create_object)

    }

    option_data={
    'data':JSON.stringify(data),
    'csrfmiddlewaretoken':'{{csrf_token}}'

    }
    // console.log(option_data)
    //ajax

     $.ajax({

            url:'/admin_dashboard/add_report_tags',
            data:option_data,
            type:"POST",
            dataType:'json',
            success:function(data){

             if(data['success']){

                 location.reload(true)

             }else{

                 alert('Please add the dropdown options')
                 return;
             }


            }

         })


    })

    })

</script>
</html>
