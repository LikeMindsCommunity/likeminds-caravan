<h3 style="padding-left:65px;">Enter collabcard id</h3>

<form style="padding-left:50px;" onsubmit="return false;">
    <div class="col" >
      <input id="card_id" type="text" class="form-control" placeholder="Collabcard ID" style="width:200px;">
    </div>

    <div class = "form-group" style="padding-left:15px; padding-top:30px;">
        <button class="btn btn-outline-info" type="submit" id="show_details">Show Card</button>
        &nbsp;&nbsp;
        <button class="btn btn-outline-danger" type="submit" data-toggle="modal" data-target="#ModalCenter">Delete Card</button>
    </div>


</form>


<div class="modal fade" id="ModalCenter" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ModalTitle">Are you sure !!!</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" id="modal_body">
        This will delete Collabcard, it's conversations and Media
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" id="delete_card" class="btn btn-primary">Delete Collabcard</button>
      </div>
    </div>
  </div>
</div>


<div id="show_card" class="container" style="padding-left:40px; padding-top:30px;">

</div>

<script>
    $('#show_details').click(function()
       {
         card_id=$('#card_id').val();

         if (card_id == '')
         {
            alert("Collabcard ID is required");
         }
         else{
             var card_id=$('#card_id').val()

              temp={
              'card_id':card_id,
              'action':'show',
              'csrfmiddlewaretoken':'{{csrf_token}}'


              }

              $.ajax({

                    url:'/admin_dashboard/delete_collabcard',
                    data:temp,
                    type: "POST",
                    dataType:'json',
                    success:function(data){
                        if(data['success']){
                                if(data['show_card']){
                                    var title = "<h4>Card : "+data['card_text']+"</h4>" + "<h5><b>Community : "+data['community_name']+"</b></h5>"
                                    $("#show_card").html(title);
                                }

                                var modal_body = "This will delete Collabcard, it's conversations and Media"
                                $("#modal_body").html(modal_body);
                                $("#ModalTitle").html('Are you sure !!!');
                                $("#delete_card").show()


                        }
                        else if(data['raise_error']){
                           var title = "Collabcard does not exist"
                           $("#show_card").html(title);
                        }
                    }
              })
         }
       })


       $('#delete_card').click(function()
       {

         card_id=$('#card_id').val();

         if (card_id == '')
         {
            alert("Collabcard ID is required");
         }
         else{
             var card_id=$('#card_id').val()

              temp={
              'card_id':card_id,
              'action':'delete',
              'csrfmiddlewaretoken':'{{csrf_token}}'


              }

              $.ajax({

                    url:'/admin_dashboard/delete_collabcard',
                    data:temp,
                    type: "POST",
                    dataType:'json',
                    success:function(data){
                        if(data['success']){
                            location.reload(true);
                        }
                        else if(data['raise_error']){

                           console.log(data);

                           var title = "Collabcard does not exist"
                           $("#modal_body").html(title);
                           $("#ModalTitle").html('Sorry !!!');
                           $("#delete_card").hide()

                        }
                    }
              })
         }
       })
</script>
