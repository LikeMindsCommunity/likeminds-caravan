{% load static %}
<html>
<head>
    <!-- Latest compiled and minified CSS -->
<!--<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">-->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

<!-- jQuery library -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

<!-- Latest compiled JavaScript -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #075e54;">
  <div class="container">
      <img style="height:40px; width:40px;" src="https://beta.collabmates.com/media/media/ic_launcher_round.png">
      <a class="navbar-brand" href="#">&nbsp;&nbsp;&nbsp;&nbsp;LikeMinds</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item active">
          <a class="nav-link" href="/admin_dashboard">Home
                <span class="sr-only">(current)</span>
              </a>
        </li>
          <li class="nav-item active" style="padding-right:10px;">
          <a class="nav-link" href="/admin_dashboard/logout">Logout
                <span class="sr-only">(current)</span>
              </a>
        </li>


      </ul>
    </div>
  </div>
</nav>

<br/><br/><br/><br/>

<div style="width:800px;  margin-left: 40px;">
<h1 >Questions for {{community_name}}</h1>
<form id="my_form" onsubmit="return false" >

    {% for question in question_list %}


    <div class="form-group">
        <label ><b>Question:{{ forloop.counter }}</b></label>

            <input type="hidden" id="id{{forloop.counter}}" value="{{question.id}}"/>
            <a href="{% url 'delete_questions'  question.id %} " style="color:red;"><i class="fa fa-trash" aria-hidden="true"></i></a>
            &nbsp;&nbsp;<a href="{% url 'add_dropdown_responses'  question.id %} " style="color:blue;margin-left:500px;">Add Dropdown</a>

        <input type="text" class="form-control" id="question{{ forloop.counter }}" value="{{question.question_title}}"/>
    </div>
  {% endfor %}
  <div id="form_field"></div>
  <button type="submit" class="btn btn-outline-secondary">Submit</button>

</form>
<button type="button" class="btn btn-primary" id="add">Add</button>
<button type="button" class="btn btn-danger" id="delete">Delete</button>

</div>
</body>


</html>

<script>

    $(document).ready(function(){
    count={{length}}

    $('#add').click(function(){
    count=count+1
    var id='question'+count
     var new_field= " <div class='form-group'> <label for='question'>Question\"" + count + "\"</label> <input type='text' class='form-control' id=\"" + id + "\"></div>"
      $('#form_field').append(new_field);
    })

   $('#delete').click(function(){
   var id='question'+count
   $('#'+id).parent('div').remove();
   count=count-1;

   })




    $('#my_form').submit(function(){

    var data=[]
    update_count={{length}};

    for(var i=1;i<=update_count;i++)
    {
        question=$('#question'+i).val()
        id=$('#id'+i).val()
        var update_object={
        'question':question,
        'update':true,
        'id':id
        }

        data.push(update_object)
    }


    for(var i=update_count+1;i<=count;i++)
    {

        question=$('#question'+i).val()

        var create_object={
        'question':question,
        'update':false
        }

        data.push(create_object)

    }

    var questions = JSON.stringify(data);
    question_data={
    'data':questions,
    'csrfmiddlewaretoken':'{{csrf_token}}'

    }
    //ajax

     $.ajax({
            url:'/admin_dashboard/add_questions/'+{{community_id}},
            data:question_data,
            type:"POST",
            dataType:'json',
            success:function(data){
              console.log(data)
              console.log(data['success'])
              if(data['success']){

                 location.reload(true)

             }

            }

         })
    })


    })

</script>
