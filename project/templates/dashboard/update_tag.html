<script>


var options="";
$("#category").on('change',function(){
    var value=$(this).val();
    $('#attribute').find('option').remove();
    $("#attribute").append('<option selected>Choose...</option>');
    if(value=="1")
    {

    {% for attr in legacy_attributes %}
console.log('{{attr.attribute_name}}')

               $("#attribute").append('<option value="{{attr.id}}">{{attr.attribute_name}}</option>');

    {% endfor %}

    }
    else if(value=="2")
    {
    {% for attr in profession_attributes %}
               $("#attribute").append('<option value="{{attr.id}}">{{attr.attribute_name}}</option>');

    {% endfor %}
    }

    else if(value=="3")
    {
    {% for attr in interests_attributes %}
               $("#attribute").append('<option value="{{attr.id}}">{{attr.attribute_name}}</option>');

    {% endfor %}
    }

    else if(value=="4")
    {
    {% for attr in geography_attributes %}
               $("#attribute").append('<option value="{{attr.id}}">{{attr.attribute_name}}</option>');
    {% endfor %}
    }

    else if(value=="5")
    {
    {% for attr in global_attributes %}
               $("#attribute").append('<option value="{{attr.id}}">{{attr.attribute_name}}</option>');
    {% endfor %}

    }

    else
        $("#attribute").find('option').remove()
});

var tag_options="";

$("#attribute").on('change',function(){
    var value=$(this).val();
    document.getElementById('all_tags').innerHTML = '';
    var div = document.getElementById('all_tags');

    console.log(value)
               $.ajax({

            url:'/admin_dashboard/get_tags/'+value,
            dataType:'json',

            success:function(data){
             obj = data['tags_list']

            var tag_div_html = `
                <div>
                    <table>
                        <tbody>
                        <tr>
                            <td style="width:250px">

                                <h5 style="color:{0};"> {1} </h5>

                            </td>
                            <td style="padding-left:20px">
                                <button type="button" onclick="open_modal('{2}','{1}');"   class="btn btn-outline-dark btn-sm">Update</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <br>
                `
            for (let key in obj) {
                  console.log(key, ':', obj[key].tag_id);
                  newHtml = tag_div_html.replace('{0}', obj[key].color).replace('{1}', obj[key].tag_name).replace('{2}', obj[key].tag_id)
                    $('#all_tags').append(newHtml)
                }


            }

         })


});


    $(document).ready(function(){

       $('#tag_form').on('submit',function()
       {
         category=$('#category').val();
         attribute=$('#attribute').val();
         uncategorized = $('#uncategorized').val();

         temp={
            'category':category,
           'attribute':attribute,
           'uncategorized':uncategorized

         }

         $.ajax({

            url:'/admin_dashboard/categorize_tag',
            type: "POST",
            data:temp,
            dataType:'json',
            success:function(data){
               console.log('hello')
               location.reload(true)

            }

         })

       })

    })
