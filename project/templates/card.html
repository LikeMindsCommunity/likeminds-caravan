{% extends 'base.html' %}


{% block content %}


<div class="ui raised padded text container segment" style="margin: 8px 8px !important;">
<div class="card">
    <div class="content">
    
      <div class="header"><img class="ui left aligned avatar image" src="{{image_url}}">{{creator}}</div>
      <div class="meta"></div>
      <div class="description">
      <br>
        {{card}}
      </div>
        <br/>
        <div style="font-size:12px;color:#00897b">{{answer_text}}</div>
    </div>
  </div>
  
</div>

<button class="ui fluid button " style=" z-index:2;width:60%; left:20%; margin:0 auto; background-color: #00897b; border-radius:20px; color:white; " onclick ="join();" >View Answers  </button>
<script>

      function join(){
      {% if user.is_authenticated %}
          window.location.href = "../view_answers/{{collabcard_id}}";
      {% else %}
      $('.test')
      .modal('show');
      {% endif %}
  }
</script>

{% endblock %}
