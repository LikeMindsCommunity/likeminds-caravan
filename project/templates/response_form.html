{% extends 'base.html' %}

{% block content %}
<div class=" ui small breadcrumb" style="padding: 0 10px;">
        <a class="section" href = "{% url 'home' %}">Home</a>
        <i class="right chevron icon divider"></i>
        <a class="section" href = "{% url 'community' data.0.community_id.id %}">{{data.0.community_id.name}}</a>
        <i class="right chevron icon divider"></i>
        <div class="active section"> Join Community</div>
</div>
<body>
    <div class="container">

            <div class="ui raised very padded text container segment">
            <form class="ui form" method="post">
                {% csrf_token %}
                <div class="center aligned content">
                        <p>In order to add relevant members to the community we would like to know few more things about you </p>
                    <br>
                    </div>
                {% for i in data %}
                <div class="field">
                      <label>{{i.data}}</label>
                      <input type="text" name="first-name" placeholder="{{i.data}}">
                </div>
                {% endfor %}
                <br>
                <button class="ui fluid button" type="submit" style="background-color: #1ebea5; color:white;">Submit</button>
                
            </form>
            </div>
              
                
    </div>
    <br>
    
</body>
{% endblock %}
