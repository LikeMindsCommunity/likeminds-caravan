<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{subject}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
    font-family: 'Roboto';
}
.main-wrapper{
    background:#f9f9f9;
    padding: 48px;
}
.main{
    max-width: 600px;
    margin: auto;
}
.content{
    margin-top:0px;
    border-radius: 8px;
    background: #fff;
    border:1px solid #eeeeee;
}
.header{
    text-align: center;
}
.logo{
    width:100%;
    height: 50px;
    text-align:center;
}
.logo img{
    height: 100px;
    width: 100px;
}
.img-wrapper{
    height: 100px;
    position:relative;
}
.mail{
    padding:48px;
    padding-top:100px;
}
.username{
    font-size: 20px;
    font-weight: bold;
    color:#444444;
    margin-bottom: 24px;
}
.mail p{
    color:#718297;
    font-size: 16px;
    margin-bottom: 24px;
    line-height: 1.5;
}
.mail p strong{
    color:#444444;
}
.mail p a{
    text-decoration: none;
    color:#00897b;
}
.mail .cta-wrapper{
    padding: 10px 0;
}
.mail .cta{
    text-decoration: none;
    background: #00897b;
    color:#fff;
    text-transform: uppercase;
    /* letter-spacing: 1px; */
    padding:14px 19px;
    border-radius:40px;
    font-size:13px;
    font-weight: 500;
    margin: 10px 0 24px;
}
.footer{
    text-align: center;
    padding-top: 20px;
}
.footer p{
    font-size: 14px;
    color:#718297;
    margin-bottom: 14px;
    margin-top: 0px;
    line-height: 1.5;
}
.footer .small p{
    font-size: 12px;
    margin-bottom: 12px;
    margin-top: 0px;
}
.footer a{
    text-decoration: none;
    color:#00897b;
}
.download-buttons a{
    display: inline-block;
    padding: 0 10px;
}
.divider{
    display: inline-block;
    width: 25%;
    height: 1px;
    background: #d8d8d8;
    margin:0 auto 12px;
}
.profile_pic img{
    border-radius:1000px
}
table.logo{
    width: 100%;
}
.logo td{
    text-align: center;
}
@media only screen and (max-width: 600px) {
    .main-wrapper {
        padding:10px;
    }
    .mail{
        padding: 80px 20px 40px;
    }
    .username{
        font-size:16px;
    }
    .mail p{
        font-size:14px;
    }
    .download-buttons{
        width: 80%;
    }
    .footer p{
        font-size: 12px;
    }
    .footer .small p{
        font-size: 10px;
    }
    .profile_pic{
        display:none;
    }
}
</style>
{% block extracss %}
{% endblock %}
</head>
<body>
    <div class="main-wrapper">
        <div class="main">
            <div class="header">
            </div>
            <div class="logo">
                <div class="img-wrapper">

                </div>
            </div>
            <div class="content">
                <div class="mail">
                    <table>
                        <tr>
                            <td>
                                {% block mail %}
                                {% endblock %}
                            </td>
                        </tr>
                    </table>

                </div>
            </div>
            <div class="footer">
                <div style="margin-top: 20px;">
