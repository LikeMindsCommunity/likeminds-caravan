<div style="padding: 24px; padding-top: 48px; max-width: 500px; margin: auto; background: #fff; border-radius: 8px; border: 1px solid #eee; box-sizing: border-box;">
  <img style="border-radius: 4px; margin-bottom: 32px;" src="https://betaweb.likeminds.community/assets/images/png/gradient.png" width="100%" height="200px">
  <div style="font-size: 16px; color: #666; text-align: left; font-weight: bold; padding: 0px 16px;">Event Happening Today!</div>
  <div style="font-size: 36px; color: #666; text-align: left; font-weight: bold; padding: 12px 16px;line-height: 42px;">{{event_name}}</div>
  <div style="font-size: 16px; color: #01897b; text-align: left; font-weight: 500; padding: 0px 16px;">On {{event_date}} at {{event_time}} (India Standard Time)</div>
  <div style="text-align: left; margin-top: 20px; padding: 0px 16px;">
    <div style="color: #718297; font-size: 16px;">We have also added the event to your calendar to make sure you are able to manage the time. Looking forward to seeing you at the event. </div>
    <div style="margin-top: 24px; width: 100%; text-align: center;">
      <a style="text-align: center; text-decoration: none; background-color: #01897b; padding: 12px 48px; color: white; border-radius: 24px;" href="{{link}}">View Event Details</a>
    </div>
    <br>
  </div>
</div>
