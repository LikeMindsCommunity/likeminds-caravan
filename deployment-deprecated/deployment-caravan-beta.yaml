# Deployment spec file for GCP GKE caravan-beta deployment
# We have moved service to container based deployment with docker and AWS EKS
# File is deprecated and moved to deployment-deprecated directory

apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "caravan-beta"
  namespace: "app-deploy"
  labels:
    app: "caravan-beta"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "caravan-beta"
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: "caravan-beta"
    spec:
      containers:
      - name: "likeminds-caravan-beta-1"
        image: "asia.gcr.io/likeminds-nonprod-prj-24e1/github.com/NateshR/likeminds-caravan/caravan-beta:93ce10d"
        resources:
          requests:
            memory: "1000Mi"
            cpu: "1000m"
          limits:
            memory: "1500Mi"
            cpu: "1500m"
  
---

apiVersion: "autoscaling/v2"
kind: "HorizontalPodAutoscaler"
metadata:
  name: "caravan-beta"
  namespace: "app-deploy"
  labels:
    app: "caravan-beta"
spec:
  scaleTargetRef:
    kind: "Deployment"
    name: "caravan-beta"
    apiVersion: "apps/v1"
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: "Resource"
    resource:
      name: "cpu"
      target:
        type: "Utilization"
        averageUtilization: 75
