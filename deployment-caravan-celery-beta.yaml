apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "caravan-celery"
  namespace: "app-deploy"
  labels:
    app: "caravan-celery"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "caravan-celery"
  template:
    metadata:
      labels:
        app: "caravan-celery"
    spec:
      containers:
      - name: "likeminds-caravan-celery-1"
        image: "asia.gcr.io/likeminds-nonprod-prj-24e1/github.com/nateshr/togther/caravan-celery:8e5c5c6"
        env:
        - name: CELERY_BROKER_URL
          valueFrom:
            secretKeyRef:
              name: caravan-celery-secret
              key: CELERY_BROKER_URL          
